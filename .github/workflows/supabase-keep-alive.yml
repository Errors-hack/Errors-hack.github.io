- name: Check Supabase secrets
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  run: |
    if [ -z "$SUPABASE_URL" ]; then
      echo "SUPABASE_URL is EMPTY"
      exit 1
    fi

    if [ -z "$SUPABASE_KEY" ]; then
      echo "SUPABASE_PUBLISHABLE_KEY is EMPTY"
      exit 1
    fi

    echo "SUPABASE_URL is available"
    echo "SUPABASE_PUBLISHABLE_KEY is available"
